# mosquitto -c mosquitto.conf
# Escucha en todas las interfaces para que la placa real llegue por WiFi.
listener 1883 0.0.0.0
allow_anonymous true
# Sin Nagle: cada mensaje sale en cuanto se publica.
set_tcp_nodelay true
persistence false
# Segundo listener en un puerto que el firewall de la PC ya deja pasar (ufw permite 53317/tcp),
# para la placa real si no se abre el 1883.
listener 53317 0.0.0.0
