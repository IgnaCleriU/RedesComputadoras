# Broker del experimento. El runner lo lanza con -c y reemplaza @CERTS@ por el
# directorio temporal donde copia los certificados (Mosquitto baja al usuario
# "mosquitto", que no puede leer dentro de /home).

# Sin autenticación: se compara el protocolo, no la autenticación
allow_anonymous true
# Nada en disco entre corridas
persistence false
# Log a stdout: el runner lo guarda en mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
# Acepta el keep-alive de 60 s de los nodos
max_keepalive 120
# Hasta 20 QoS 1 sin confirmar por cliente hacia el suscriptor
max_inflight_messages 20
# Cola grande hacia el suscriptor: el backend nunca pierde mensajes por cola llena
max_queued_messages 10000

# Suscriptor del backend. Por 127.0.0.1 no pasa por br-exp: queda fuera de la
# captura, que así solo ve el tramo nodo → broker.
listener 1883 127.0.0.1

# Nodos, sin TLS
listener 1883 10.10.0.1

# Nodos, con TLS: 1.2 y la misma suite que el HTTPS del backend.
# Como la CA está en cafile, Mosquitto manda la cadena completa en el handshake
# (servidor + CA): ~411 B más por handshake que el servidor Go, que solo manda
# el del servidor.
listener 8883 10.10.0.1
cafile @CERTS@/ca.crt
certfile @CERTS@/server.crt
keyfile @CERTS@/server.key
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES128-GCM-SHA256
