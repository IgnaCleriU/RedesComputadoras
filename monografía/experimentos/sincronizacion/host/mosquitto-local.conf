# mosquitto -c host/mosquitto-local.conf
# Prueba local sin privilegios (correr.py --local): los nodos con red de usuario de QEMU
# llegan al host por 10.0.2.2, así que el broker escucha en todas las interfaces.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
set_tcp_nodelay true
max_queued_messages 100000
max_queued_bytes 0
log_type error
log_type warning
connection_messages false
