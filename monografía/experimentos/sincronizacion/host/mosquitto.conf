# mosquitto -c host/mosquitto.conf
# Broker del experimento de sincronización. Solo escucha en el puente de los nodos y en
# loopback (el logger se suscribe por 127.0.0.1). Acepta MQTT 3.1.1 y 5 (el protocolo por
# defecto no restringe la versión).
listener 1883 10.10.0.1
listener 1883 127.0.0.1
allow_anonymous true
persistence false
# Sin Nagle: cada mensaje sale en cuanto se publica.
set_tcp_nodelay true
# Cada nodo se suscribe a las fases de todos los demás: la cola por cliente tiene que
# aguantar ráfagas sin descartar.
max_queued_messages 100000
max_queued_bytes 0
# Solo errores y advertencias: cada conexión y desconexión suma líneas de log.
log_type error
log_type warning
connection_messages false
